name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  release:
    types: [ published ]
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN; jobs opt into more only where they need it.
permissions:
  contents: read

# The npm packages live at src/Bielu.AspNetCore.AsyncApi.Scalar.SignalR/assets (@bielu/scalar-signalr)
# and src/Bielu.AspNetCore.AsyncApi.Scalar.Grpc/assets (@bielu/scalar-grpc); the changeset workspace
# root is the repository root (package.json + .changeset). The reusable templates take a single npm
# working-directory, so the gRPC package gets its own npm-only job next to each combined job.
#
# NOTE: reusable-workflow refs use @main here. Pin them to the merged
# bielu/bielu.GithubActions.Templates commit SHA before relying on this in anger, the same way the
# previous revision pinned @c18e6a807678b8d8eec47974b3c9ceac3cfba41b.
jobs:
  # Pull request: build the NuGet and npm packages for validation, publish nothing.
  ci:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/ciCombined.yml@main
    with:
      suffix: "pr"
      generate-schema: false
      working-directory: src/Bielu.AspNetCore.AsyncApi.Scalar.SignalR/assets
      artifact-name: npm-scalar-signalr

  # Pull request: build the second npm package (@bielu/scalar-grpc); NuGet is already covered by `ci`.
  ciGrpcNpm:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/ciCombined.yml@main
    with:
      suffix: "pr"
      build-nuget: false
      working-directory: src/Bielu.AspNetCore.AsyncApi.Scalar.Grpc/assets
      artifact-name: npm-scalar-grpc

  # Pull request: require a changeset so the version bump + changelog are recorded.
  changeset-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a changeset
        run: |
          # Files added by this PR under .changeset/, excluding README/config. A directory pathspec
          # is used deliberately: the git glob '.changeset/**/*.md' does NOT match top-level files
          # like '.changeset/foo.md' (its '**/' requires an intermediate directory).
          ADDED=$(git diff --diff-filter=A --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- .changeset \
            | { grep -E '\.changeset/.+\.md$' || true; } \
            | { grep -vE '/(README|config)\.' || true; })
          if [ -z "$ADDED" ]; then
            echo "::error::No changeset found in this PR. Run 'npx changeset' to describe your change, or 'npx changeset add --empty' for chore-only PRs."
            exit 1
          fi
          echo "Found changeset(s):"; echo "$ADDED"

  # Pull request: prove the Native AOT path still works. The source generator replaces the reflection
  # scan under AOT, so the two providers can diverge silently — this publishes the AOT example and
  # asserts it serves byte-for-byte the same document as the ordinary reflection-based build.
  # Roadmap PR 9 scoped this check; it is wired up here.
  aot-verification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Blocking. It is the only thing standing between "README claims Native AOT support" and that
    # claim being true — three separate defects made the AOT path throw at runtime, and none of them
    # were visible to the rest of the suite.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Install the native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # Invoked through bash rather than executed directly: this repository is developed on Windows
      # with core.filemode=false, so the executable bit on a committed script is easy to lose.
      - name: Verify Native AOT
        run: bash scripts/verify-aot.sh linux-x64

  # Push to main: consume changesets into a "Version Packages" PR. While changesets are pending it
  # (re)opens that PR; once it is merged and the changesets are gone, hasChangesets becomes false and
  # the release jobs below take over.
  version:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/versionChangeset.yml@main
    with:
      working-directory: .

  # Version PR merged (no changesets left): publish the NuGet + npm packages at the versions the
  # Version PR committed. While changesets pre mode is active (.changeset/pre.json — no stable
  # release until the upstream Scalar plugins PR merges), those versions are `-preview.N`
  # prereleases; after `changeset pre exit` they become stable. Both publish steps are idempotent
  # (NuGet --skip-duplicate; npm skips already-published versions), so re-running on later
  # non-changeset pushes is a safe no-op.
  releaseStable:
    needs: version
    if: github.event_name == 'push' && needs.version.outputs.hasChangesets == 'false'
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/release.yml@main
    # npm publishes via trusted publishing (OIDC): the trusted publisher on npmjs.com
    # references this repo + this workflow file, and the job must mint an OIDC token.
    permissions:
      contents: read
      id-token: write
    with:
      generate-schema: false
      working-directory: src/Bielu.AspNetCore.AsyncApi.Scalar.SignalR/assets
      artifact-name: npm-scalar-signalr
    secrets:
      NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}

  # Version PR merged: publish the second npm package (@bielu/scalar-grpc); NuGet is published by
  # releaseStable above (publish-nuget: false avoids a double publish).
  releaseStableGrpcNpm:
    needs: [version, releaseStable]
    if: github.event_name == 'push' && needs.version.outputs.hasChangesets == 'false'
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/release.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      publish-nuget: false
      working-directory: src/Bielu.AspNetCore.AsyncApi.Scalar.Grpc/assets
      artifact-name: npm-scalar-grpc

  # Record-keeping: tag + GitHub Release for the shared NuGet version, when not already present.
  # Release notes are the version's section of CHANGELOG.md (written by the changeset adapter in
  # the Version Packages PR); versions with a prerelease suffix are marked as GitHub prereleases.
  # (Created with GITHUB_TOKEN, so it does not itself trigger the `release` job — publishing is done
  # by the release job above.)
  tagRelease:
    needs: version
    if: github.event_name == 'push' && needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create GitHub Release for the shared NuGet version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' version.props)
          SUFFIX=$(grep -oPm1 '(?<=<VersionSuffix>)[^<]+' version.props || true)
          VERSION="$PREFIX"; [ -n "$SUFFIX" ] && VERSION="$PREFIX-$SUFFIX"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to tag."
            exit 0
          fi
          node scripts/release-notes.mjs > release-notes.md
          PRERELEASE_FLAG=""; [ -n "$SUFFIX" ] && PRERELEASE_FLAG="--prerelease"
          echo "Creating release v$VERSION $PRERELEASE_FLAG"
          gh release create "v$VERSION" --title "v$VERSION" \
            --notes-file release-notes.md $PRERELEASE_FLAG

  # Decide what the in-flight betas should be numbered. The build templates would otherwise stamp
  # `-beta.<ticks>` onto the version the repository currently carries — which, right after a stable
  # release, is the version that just shipped, so the beta would sort BELOW it and read as a
  # downgrade. This job derives each package's version from the pending changesets instead, so the
  # first beta after 1.0.0 ships as 1.1.0-beta.<stamp> (or 1.0.1-beta.<stamp> for a patch bump).
  betaVersions:
    needs: version
    if: >-
      always() && !cancelled()
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && needs.version.outputs.hasChangesets == 'true'))
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/nextVersion.yml@main
    with:
      # The synthetic changeset package that carries the shared NuGet version; the npm packages are
      # read out of the `versions` map by name below.
      nuget-package: bielu-aspnetcore-asyncapi

  # In-flight prereleases: publish a beta of main while a release is still pending (changesets not yet
  # merged), and on manual dispatch. Skipped on the Version-PR-merge commit so it does not shadow the
  # stable release.
  releaseBeta:
    needs: [version, betaVersions]
    if: >-
      always() && !cancelled() && needs.betaVersions.result == 'success'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && needs.version.outputs.hasChangesets == 'true'))
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/release.yml@main
    permissions:
      contents: read
      id-token: write
    # No `suffix:` here on purpose — the overrides below already carry the `-beta.<stamp>` part, and
    # a suffix would take precedence over them in the build templates.
    with:
      nuget-version-override: ${{ needs.betaVersions.outputs.nuget }}
      npm-version-override: ${{ fromJSON(needs.betaVersions.outputs.versions)['@bielu/scalar-signalr'] }}
      generate-schema: false
      working-directory: src/Bielu.AspNetCore.AsyncApi.Scalar.SignalR/assets
      artifact-name: npm-scalar-signalr
    secrets:
      NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}

  # In-flight prereleases for the second npm package (@bielu/scalar-grpc).
  releaseBetaGrpcNpm:
    needs: [version, betaVersions, releaseBeta]
    if: >-
      always() && !cancelled() && needs.betaVersions.result == 'success'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && needs.version.outputs.hasChangesets == 'true'))
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/release.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      npm-version-override: ${{ fromJSON(needs.betaVersions.outputs.versions)['@bielu/scalar-grpc'] }}
      publish-nuget: false
      working-directory: src/Bielu.AspNetCore.AsyncApi.Scalar.Grpc/assets
      artifact-name: npm-scalar-grpc

  # Record-keeping for interim betas: surface each published beta build as a GitHub prerelease,
  # using the exact `-beta.<stamp>` version that was packed (release.yml's nuget-version output,
  # which echoes the betaVersions override) and the pending — not yet versioned — changesets as the
  # release notes.
  tagBeta:
    needs: releaseBeta
    if: always() && !cancelled() && needs.releaseBeta.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create GitHub prerelease for the beta build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.releaseBeta.outputs.nuget-version }}"
          if [ -z "$VERSION" ]; then
            echo "No NuGet version output from the beta build; skipping."
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to tag."
            exit 0
          fi
          node scripts/release-notes.mjs --pending > release-notes.md
          echo "Creating prerelease v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" \
            --notes-file release-notes.md --prerelease

  # Manual GitHub Release (escape hatch): build and publish stable packages. Independent of the
  # changeset-driven path above and idempotent, so the two cannot double-publish.
  release:
    if: github.event_name == 'release'
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/release.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      generate-schema: false
      working-directory: src/Bielu.AspNetCore.AsyncApi.Scalar.SignalR/assets
    secrets:
      NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}

  # Manual GitHub Release: the second npm package (@bielu/scalar-grpc).
  releaseGrpcNpm:
    if: github.event_name == 'release'
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/release.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      publish-nuget: false
      working-directory: src/Bielu.AspNetCore.AsyncApi.Scalar.Grpc/assets
